services:
  xray:
    image: teddysun/xray:25.10.15
    restart: on-failure
    volumes:
      - "./xray:/etc/xray"
      - "./cert:/etc/cert"
      - "./cert_check.sh:/bin/cert_check.sh"
    ports:
      - "443:443"
      - "444:443"
      - "445:443"
      - "446:443"
      - "447:443"
      - "448:443"
      - "449:443"
      - "450:443"
      - "451:443"
      - "452:443"
      - "453:443"
      - "454:443"
      - "455:443"
      - "4433:443"
      - "127.0.0.1:10086:10086"
  caddy:
    restart: on-failure
    image: "caddy"
    network_mode: host
    environment:
      - CDN_DOMAIN=${CDN_DOMAIN:-}
      - CDN_PATH=${CDN_PATH:-}
    volumes:
      - "./caddy/Caddyfile:/etc/caddy/Caddyfile"
      - "./cert-cdn:/etc/origin:ro"
    ports:
      - "80:80"
  tg:
    restart: on-failure
    image: telegrammessenger/proxy
    ports:
      - "2333:443"
    env_file:
      - tg.env
